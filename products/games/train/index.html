<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e57448"><title>听指令小火车</title><link rel="stylesheet" href="../shared/learning-games.css?v=20260712-ipad2"></head><body><div class="world-bg"><i>✦</i><i>✦</i><i>✦</i></div><main class="learning-app">
<section id="welcome" class="screen welcome active"><a class="back-link" href="../">‹ 返回游戏乐园</a><div class="hero-toy" style="--hero:#efc769">🚂<small>➜</small>🐰<small>➜</small>🍎</div><p class="kicker">认真听，按顺序做</p><h1>听指令<br><em>小火车</em></h1><p class="intro">听清楚颜色、动物和先后顺序，<br>帮助乘客坐上正确的车厢！</p><button id="start" class="primary"><span>从第1关开始</span><b>➜</b></button><button id="soundW" class="sound-toggle">🔊 声音开着</button></section>
<section id="game" class="screen game"><header class="game-header"><button id="home" class="circle" aria-label="返回游戏首页">⌂</button><div id="progress" class="progress"></div><span id="levelPill" class="level-pill">第1关</span><button id="soundG" class="circle" aria-label="关闭声音">🔊</button></header><section class="task-card"><div class="guide">🐦</div><div class="task-copy"><p>列车长的任务</p><h2 id="task">听语音，把乘客送上车</h2></div><button id="listen" class="listen">🔊 重听</button></section><section class="board"><div id="train" class="train-track"></div><div id="tray" class="train-tray"></div></section><div id="feedback" class="feedback">先听一听列车长怎么说。</div><div class="actions"><button id="reset" class="soft">↻ 重新安排</button><button id="hint" class="soft">💡 帮我一步</button><button id="check" class="check">检查火车 ✓</button></div></section>
<div id="overlay" class="overlay"><div class="result"><div class="result-icon">🚂</div><h2>小火车出发啦！</h2><p id="resultText"></p><button id="next" class="primary"><span>下一关</span><b>➜</b></button></div></div>
<section id="finish" class="screen finish"><p class="kicker">10关全部完成</p><h2>金牌列车长！</h2><div class="medal">🏅</div><p>你能认真倾听，还能按顺序完成多个任务！</p><button id="again" class="primary"><span>再玩一次</span><b>↻</b></button><a class="finish-link" href="../">返回游戏乐园</a></section>
</main><script src="../shared/learning-core.js"></script><script src="game.js"></script><script defer src="/analytics.js"></script></body></html>
