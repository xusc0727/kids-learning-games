<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#668fba"><title>图形建筑师</title><link rel="stylesheet" href="../shared/learning-games.css?v=20260712-ipad2"></head><body><div class="world-bg"><i>✦</i><i>✦</i><i>✦</i></div><main class="learning-app">
<section id="welcome" class="screen welcome active"><a class="back-link" href="../">‹ 返回游戏乐园</a><div class="hero-toy" style="--hero:#9dc8c6"><span style="color:#668fba">▲</span><span style="color:#e5ad43">■</span><span style="color:#e96f55">●</span></div><p class="kicker">认图形，搭建筑</p><h1>图形<br><em>建筑师</em></h1><p class="intro">观察图形的形状、大小和位置，<br>用积木搭出房子、火箭和小动物！</p><button id="start" class="primary"><span>戴上安全帽</span><b>➜</b></button><button id="soundW" class="sound-toggle">🔊 声音开着</button></section>
<section id="game" class="screen game"><header class="game-header"><button id="home" class="circle" aria-label="返回游戏首页">⌂</button><div id="progress" class="progress"></div><span id="pill" class="level-pill">第1关</span><button id="soundG" class="circle" aria-label="关闭声音">🔊</button></header><section class="task-card"><div class="guide">🦫</div><div class="task-copy"><p id="buildName">小房子</p><h2>观察左边图纸，在右边补上图形</h2></div><button id="listen" class="listen">🔊 提示</button></section><section class="board"><div class="builder"><div class="blueprint"><h3>设计图</h3><div id="target" class="shape-layout"></div></div><div class="build-pad"><h3>我的建筑</h3><div id="build" class="shape-layout"></div></div><div id="palette" class="shape-palette"></div></div></section><div id="feedback" class="feedback">先选一种积木，再点右边相同形状的虚线位置。</div><div class="actions"><button id="reset" class="soft">↻ 拆掉重搭</button><button id="hint" class="soft">💡 帮我一块</button><button id="check" class="check">检查建筑 ✓</button></div></section>
<div id="overlay" class="overlay"><div class="result"><div class="result-icon">🏠</div><h2>建筑完成啦！</h2><p id="resultText"></p><button id="next" class="primary"><span>下一关</span><b>➜</b></button></div></div><section id="finish" class="screen finish"><p class="kicker">10张设计图全部完成</p><h2>金牌建筑师！</h2><div class="medal">🏅</div><p>你能辨认图形、观察位置，还会把不同图形组合成完整作品！</p><button id="again" class="primary"><span>再玩一次</span><b>↻</b></button><a class="finish-link" href="../">返回游戏乐园</a></section>
</main><script src="../shared/learning-core.js"></script><script src="game.js"></script></body></html>
