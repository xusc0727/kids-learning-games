<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#65905e"><title>小小整理家</title><link rel="stylesheet" href="../shared/learning-games.css?v=20260712-ipad2"></head><body><div class="world-bg"><i>✦</i><i>✦</i><i>✦</i></div><main class="learning-app">
<section id="welcome" class="screen welcome active"><a class="back-link" href="../">‹ 返回游戏乐园</a><div class="hero-toy" style="--hero:#e9c982">🧸 📚 🧦 ✏️</div><p class="kicker">分分类，收整齐</p><h1>小小<br><em>整理家</em></h1><p class="intro">听任务、分物品、检查有没有遗漏，<br>养成自己整理的好习惯！</p><button id="start" class="primary"><span>开始整理</span><b>➜</b></button><button id="soundW" class="sound-toggle">🔊 声音开着</button></section>

<div id="overlay" class="overlay"><div class="result"><div class="result-icon">✨</div><h2>房间整齐啦！</h2><p id="resultText"></p><button id="next" class="primary"><span>下一关</span><b>➜</b></button></div></div><section id="finish" class="screen finish"><p class="kicker">10个房间全部完成</p><h2>整理小管家！</h2><div class="medal">🏅</div><p>你会按用途分类、按顺序完成任务，还记得最后认真检查！</p><button id="again" class="primary"><span>再玩一次</span><b>↻</b></button><a class="finish-link" href="../">返回游戏乐园</a></section>
