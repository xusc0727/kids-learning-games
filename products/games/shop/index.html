<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#dc8b4e"><title>森林小超市</title><link rel="stylesheet" href="../shared/learning-games.css?v=20260712-ipad2"></head><body><div class="world-bg"><i>✦</i><i>✦</i><i>✦</i></div><main class="learning-app">
<section id="welcome" class="screen welcome active"><a class="back-link" href="../">‹ 返回游戏乐园</a><div class="hero-toy" style="--hero:#8fc5a0">🧺 🍎 🍌 🥕</div><p class="kicker">数一数，分一分</p><h1>森林<br><em>小超市</em></h1><p class="intro">听顾客的购物清单，挑选正确的商品和数量，<br>在生活里发现有趣的数学！</p><button id="start" class="primary"><span>开门营业</span><b>➜</b></button><button id="soundW" class="sound-toggle">🔊 声音开着</button></section>
<section id="game" class="screen game"><header class="game-header"><button id="home" class="circle" aria-label="返回游戏首页">⌂</button><div id="progress" class="progress"></div><span id="pill" class="level-pill">第1关</span><button id="soundG" class="circle" aria-label="关闭声音">🔊</button></header><section class="task-card"><div class="guide" id="customer">🐰</div><div class="task-copy"><p>顾客的购物清单</p><h2 id="task">请挑选正确商品</h2></div><button id="listen" class="listen">🔊 重听</button></section><section class="board"><div id="note" class="order-note"></div><div id="shelf" class="shop-shelf"></div><div id="basket" class="basket"></div></section><div id="feedback" class="feedback">点商品就能放进购物篮。</div><div class="actions"><button id="reset" class="soft">↻ 清空篮子</button><button id="hint" class="soft">💡 提示</button><button id="check" class="check">去结账 ✓</button></div></section>
<div id="overlay" class="overlay"><div class="result"><div class="result-icon">🧺</div><h2>买齐啦！</h2><p id="resultText"></p><button id="next" class="primary"><span>下一关</span><b>➜</b></button></div></div><section id="finish" class="screen finish"><p class="kicker">10张清单全部完成</p><h2>超市小达人！</h2><div class="medal">🏅</div><p>你会分类、比较数量，也能解决生活里的简单加减问题！</p><button id="again" class="primary"><span>再玩一次</span><b>↻</b></button><a class="finish-link" href="../">返回游戏乐园</a></section>
</main><script src="../shared/learning-core.js"></script><script src="game.js"></script><script defer src="/analytics.js"></script></body></html>
