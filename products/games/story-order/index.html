<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#db7650"><title>故事排排队</title><link rel="stylesheet" href="../shared/learning-games.css?v=20260712-ipad2"></head><body><div class="world-bg"><i>✦</i><i>✦</i><i>✦</i></div><main class="learning-app">
<section id="welcome" class="screen welcome active"><a class="back-link" href="../">‹ 返回游戏乐园</a><div class="hero-toy" style="--hero:#efb78d">🌱 <small>➜</small> 🌿 <small>➜</small> 🌻</div><p class="kicker">看图片，讲故事</p><h1>故事<br><em>排排队</em></h1><p class="intro">观察每张图片发生了什么，<br>把故事按照正确顺序排好！</p><button id="start" class="primary"><span>翻开故事书</span><b>➜</b></button><button id="soundW" class="sound-toggle">🔊 声音开着</button></section>
<section id="game" class="screen game"><header class="game-header"><button id="home" class="circle" aria-label="返回游戏首页">⌂</button><div id="progress" class="progress"></div><span id="pill" class="level-pill">第1关</span><button id="soundG" class="circle" aria-label="关闭声音">🔊</button></header><section class="task-card"><div class="guide">🦉</div><div class="task-copy"><p id="storyName">种子长大了</p><h2>按“开始—经过—结果”排好图片</h2></div><button id="listen" class="listen">🔊 提示</button></section><section class="board"><div id="strip" class="story-strip"></div><div id="tray" class="story-tray"></div></section><div id="feedback" class="feedback">先观察图片，再选择第一张。</div><div class="actions"><button id="reset" class="soft">↻ 重新排序</button><button id="hint" class="soft">💡 帮我一张</button><button id="check" class="check">讲完整故事 ✓</button></div></section>
<div id="overlay" class="overlay"><div class="result"><div class="result-icon">📖</div><h2>故事讲通啦！</h2><p id="resultText"></p><button id="next" class="primary"><span>下一关</span><b>➜</b></button></div></div><section id="finish" class="screen finish"><p class="kicker">10个故事全部完成</p><h2>小小故事家！</h2><div class="medal">🏅</div><p>你能观察图片、理解前因后果，还能按顺序讲完整故事！</p><button id="again" class="primary"><span>再玩一次</span><b>↻</b></button><a class="finish-link" href="../">返回游戏乐园</a></section>
</main><script src="/products/shared/child-voice.js?v=20260728-1"></script><script src="../shared/learning-core.js"></script><script src="game.js"></script><script defer src="/analytics.js"></script></body></html>
